<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mi Entreno">
<title>Mi Entreno</title>
<style>
/* Modo noche fijo: siempre oscuro, sea cual sea el tema del dispositivo */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
 --bg:#0b0d10;--card:#15181d;--ink:#eceef1;--mute:#9aa0aa;--line:#262a31;--acc:#ff7a45;--acc2:#3a2219;--ok:#4cc38a;--okbg:#17301f;--warn:#e0a54a;--chip:#1f232a;
 --shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
header .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:15px;margin:0 0 4px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.sub{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.sub button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.sub button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:9px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:20px;font-weight:400;line-height:1}
nav.tabs button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.muted{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mute);margin:2px 4px 2px 0}
.chip.acc{background:var(--acc2);color:var(--acc)}.chip.ok{background:var(--okbg);color:var(--ok)}
.pill{font-size:12px;background:var(--acc2);color:var(--acc);padding:5px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.btn{border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.block{width:100%}
.btn.danger{background:none;color:#d64545;padding:6px 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:6px;align-items:center;margin-top:8px}
.sets .h{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.sets input{padding:7px 8px;text-align:center}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.code{flex:none;width:28px;height:28px;border-radius:8px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13px}
.last{font-size:13px;color:var(--mute);margin-top:6px;background:var(--chip);padding:6px 9px;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.opt{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.opt b{display:block;font-size:13px;margin-bottom:4px}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.macro div{background:var(--chip);border-radius:10px;padding:8px 2px}
.macro strong{display:block;font-size:18px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img,.photos .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--chip);cursor:zoom-in;display:block}
.photos .ph{display:grid;place-items:center;color:var(--mute);font-size:12px;cursor:default}
.cap{font-size:11px;color:var(--mute);text-align:center;margin-top:2px}
.meas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.meas div{background:var(--chip);border-radius:9px;padding:6px;text-align:center;font-size:12px;color:var(--mute)}
.meas strong{display:block;color:var(--ink);font-size:15px}
.up{color:var(--ok)}.down{color:#d64545}
.meal{display:flex;gap:10px;align-items:flex-start}
.meal input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--acc)}
.progress{height:8px;background:var(--chip);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:9px}
svg.chart{width:100%;height:auto;display:block}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.timer{position:fixed;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;cursor:zoom-in}
@media (max-width:420px){.meas{grid-template-columns:repeat(2,1fr)}.macro strong{font-size:16px}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0">
 <div class="row"><h1 id="title">Mi Entreno</h1><span class="pill" id="nextRev"></span></div>
 <div class="sub" id="sub"></div>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs">
 <button data-t="entrenos"><b>🏋️</b>Entrenos</button>
 <button data-t="dieta"><b>🥗</b>Dieta</button>
 <button data-t="revisiones"><b>📸</b>Fotos y revisiones</button>
</nav>
<script src="seed.js"></script>
<script src="dieta.js"></script>
<script>
// ---------- Almacenamiento ----------
// Modo nube (publicada en Claude): datos en el capability `db`, fotos nuevas en `assets`, sincronizado entre dispositivos.
// Modo local (abriendo index.html): datos en localStorage, fotos nuevas en IndexedDB.
const KEY='miEntreno.v1';
const CLOUD=!!window.claude;
let DB=null,ASSETS=null,S;
if(CLOUD){S={workouts:[],reviews:[],weights:[],diet:{}}}
else{try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
 if(!S)S={workouts:SEED.workouts,reviews:SEED.reviews,weights:SEED.weights,diet:{},created:new Date().toISOString()}}
const save=()=>{if(CLOUD)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar: '+e.message)}};
save();
const PLAN=SEED.plan;
const queue={};
function dbWrite(path,fn){queue[path]=(queue[path]||Promise.resolve()).then(fn).catch(e=>toast(e?.code==='quota_exceeded'?'Almacenamiento lleno: borra registros antiguos':'No se pudo guardar. Revisa tu conexión'))}
const plain=o=>JSON.parse(JSON.stringify(o));
function putItem(col,obj){save();if(DB)dbWrite(col+'/'+obj.id,()=>DB.doc(col+'/'+obj.id).set(plain(obj)))}
function delItem(col,id){save();if(DB)dbWrite(col+'/'+id,()=>DB.doc(col+'/'+id).delete())}
const dietTimers={};
function saveDay(d){save();if(!DB)return;clearTimeout(dietTimers[d]);dietTimers[d]=setTimeout(()=>dbWrite('diet/'+d,()=>DB.doc('diet/'+d).set(plain(S.diet[d]))),700)}
let renderPending=false;
function softRender(){const a=document.activeElement;if(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){renderPending=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(renderPending){renderPending=false;softRender()}},300));
if(CLOUD)(async()=>{
 DB=await window.claude.use('db');ASSETS=await window.claude.use('assets');
 if(!DB){toast('No se pudo conectar con tus datos');return}
 for(const col of ['workouts','reviews','weights','diet'])
  DB.collection(col).onSnapshot(snap=>{const rows=snap.docs.map(d=>plain(d.data()));
   if(col==='diet'){S.diet={};rows.forEach(r=>{if(r.date)S.diet[r.date]=r})}else S[col]=rows;softRender()},()=>toast('Se perdió la conexión con tus datos. Recarga la página'));
})();
// Fotos nuevas en IndexedDB
const idb=new Promise((res,rej)=>{const r=indexedDB.open('miEntrenoFotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=(k,v)=>idb.then(db=>new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)}));
const idbGet=k=>idb.then(db=>new Promise(res=>{const r=db.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}));
const idbDel=k=>idb.then(db=>db.transaction('f','readwrite').objectStore('f').delete(k));
const idbAll=()=>idb.then(db=>new Promise(res=>{const out={};const c=db.transaction('f').objectStore('f').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)}}));

// ---------- Utilidades ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isoL=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};const todayISO=()=>isoL(new Date());
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const fdate=iso=>{if(!iso)return 'Sin fecha';const d=new Date(iso+'T12:00');return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear()};
const fshort=iso=>{const d=new Date(iso+'T12:00');return DIA[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()]};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&!/\//.test(String(v))?n:null};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function lightbox(src){const e=document.createElement('div');e.className='lb';e.innerHTML='<img src="'+esc(src)+'">';e.onclick=()=>e.remove();document.body.appendChild(e)}
async function photoSrc(p){if(!p)return null;if(p.startsWith('idb:'))return await idbGet(p.slice(4));if(p.startsWith('asset:'))return '/_blob/'+p.slice(6);return p}
async function storePhoto(blob,key){
 if(ASSETS){const r=await ASSETS.upload(blob,{type:'image/jpeg'});return 'asset:'+r.id}
 if(CLOUD)throw new Error('sin permiso');
 const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});
 await idbPut(key,url);return 'idb:'+key}
async function dropPhoto(p){try{if(p?.startsWith('idb:'))await idbDel(p.slice(4));if(p?.startsWith('asset:')&&ASSETS)await ASSETS.delete(p.slice(6))}catch(e){}}
// Confirmación dentro de la página: el primer toque pide confirmar, el segundo ejecuta
function ask(btn,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed='1';const t=btn.textContent;btn.textContent='¿Seguro? Toca otra vez';setTimeout(()=>{delete btn.dataset.armed;btn.textContent=t},3000)}
async function hydrate(root=document){for(const img of root.querySelectorAll('img[data-p]')){const s=await photoSrc(img.dataset.p);if(s)img.src=s;else img.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'Sin foto'}))}}
function resizeImage(file,max=1280){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('imagen')),'image/jpeg',.82)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

// Gráfica de línea simple en SVG
function lineChart(pts,{unit='',h=170}={}){
 pts=pts.filter(p=>p.y!=null).sort((a,b)=>a.x<b.x?-1:1);
 if(pts.length<2)return '<p class="muted small">Hacen falta al menos 2 registros para ver la gráfica.</p>';
 const W=640,H=h,L=40,R=12,T=14,B=26;
 const xs=pts.map(p=>new Date(p.x).getTime()),ys=pts.map(p=>p.y);
 let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=1;y1+=1}const pad=(y1-y0)*.12;y0-=pad;y1+=pad;
 const x0=Math.min(...xs),x1=Math.max(...xs);
 const X=t=>L+(W-L-R)*(x1===x0?.5:(t-x0)/(x1-x0)),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
 const d=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
 let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${v.toFixed(1).replace('.0','')}</text>`}
 const fx=t=>{const d=new Date(t);return d.getDate()+' '+MES[d.getMonth()]};
 g+=`<text x="${L}" y="${H-6}" font-size="11" fill="var(--mute)">${fx(x0)}</text><text x="${W-R}" y="${H-6}" font-size="11" fill="var(--mute)" text-anchor="end">${fx(x1)}</text>`;
 const dots=pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.y)}" r="3.5" fill="var(--acc)"><title>${fx(xs[i])}: ${p.y}${unit}</title></circle>`).join('');
 const last=pts[pts.length-1];
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica">${g}<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${X(xs[xs.length-1])-4}" y="${Y(last.y)-9}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${last.y}${unit}</text></svg>`;
}

// Próxima revisión: cada 2 semanas en viernes (ancla 16/10/2026, igual que el recordatorio del calendario)
function nextReview(){const anchor=new Date('2026-10-16T00:00');const t=new Date();t.setHours(0,0,0,0);let d=new Date(anchor);
 while(d<t)d.setDate(d.getDate()+14);while(d-t>=14*864e5)d.setDate(d.getDate()-14);return d}
function renderNext(){const d=nextReview();const t=new Date();t.setHours(0,0,0,0);const n=Math.round((d-t)/864e5);
 $('#nextRev').textContent=n===0?'📸 ¡Hoy toca revisión!':'📸 Revisión '+(n===1?'mañana':'en '+n+' días');
 $('#nextRev').title='Próxima revisión: '+fshort(isoL(d))}

// ---------- Navegación ----------
const SUBS={entrenos:[['registrar','Registrar'],['plan','Plan'],['historico','Histórico'],['progreso','Pesos y récords']],
 dieta:[['hoy','Hoy'],['plan','Plan'],['recetas','Recetas'],['historico','Histórico']],
 revisiones:[['historial','Historial'],['nueva','Nueva revisión'],['comparar','Comparar'],['peso','Peso y pasos'],['datos',CLOUD?'Mis datos':'Copia de seguridad']]};
let tab='entrenos',sub={entrenos:'registrar',dieta:'hoy',revisiones:'historial'};
try{const st=JSON.parse(localStorage.getItem(KEY+'.nav')||'null');if(st){tab=st.tab;sub=st.sub}}catch(e){}
function go(t,s){tab=t;if(s)sub[t]=s;try{localStorage.setItem(KEY+'.nav',JSON.stringify({tab,sub}))}catch(e){}render();window.scrollTo(0,0)}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
$('#sub').onclick=e=>{const b=e.target.closest('button');if(b)go(tab,b.dataset.s)};
function render(){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#sub').innerHTML=SUBS[tab].map(([k,l])=>`<button data-s="${k}" class="${sub[tab]===k?'on':''}">${l}</button>`).join('');
 renderNext();
 const v=$('#view');v.innerHTML='';
 V[tab][sub[tab]](v);
 if(!CLOUD&&!S.workouts.length&&!S.reviews.length&&!(tab==='revisiones'&&sub.revisiones==='datos'))
  v.insertAdjacentHTML('afterbegin',`<div class="card" style="background:var(--acc2);border-color:transparent;margin-top:12px"><b>¿Primera vez en este dispositivo?</b><p class="small" style="margin:4px 0 8px">Restaura tu copia de seguridad para traer tu histórico, tus revisiones y tus fotos.</p><button class="btn sm" onclick="go('revisiones','datos')">Restaurar copia</button></div>`);
 hydrate(v);
}
const V={entrenos:{},dieta:{},revisiones:{}};

// ================= ENTRENOS =================
const exName=(s,c)=>(PLAN.find(p=>p.id===s)?.ex.find(e=>e.code===c)||{}).name||('Ejercicio '+c);
const setsTxt=sets=>sets.map(x=>`${x.kg||'–'}kg×${x.reps||'–'}${x.rir!==''&&x.rir!=null?' @'+x.rir:''}`).join(' · ');
const sortedW=()=>[...S.workouts].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.id>a.id?1:-1));
function lastFor(s,c,excludeId){return sortedW().find(w=>w.session===s&&w.id!==excludeId&&w.ex[c]?.sets.some(x=>num(x.kg)!=null||(!x.kg&&num(x.reps)!=null)))}
function suggestSession(){const l=sortedW()[0];return l?(l.session%3)+1:1}
let draft=null;
V.entrenos.registrar=v=>{
 if(!draft)draft={id:uid(),date:todayISO(),session:suggestSession(),ex:{}};
 const p=PLAN.find(x=>x.id===draft.session);
 v.innerHTML=`<div class="card"><div class="grid2"><div><label>Sesión</label><select id="ses">${PLAN.map(x=>`<option value="${x.id}" ${x.id===draft.session?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
 <div><label>Fecha</label><input type="date" id="wdate" value="${draft.date}"></div></div>
 <p class="tiny muted" style="margin:10px 0 0">Sobrecarga progresiva: cuando llegues al límite superior de repeticiones, sube el peso un 2,5-5%. Cardio: 10.000 pasos al día.</p></div>
 ${p.ex.map(e=>{const d=draft.ex[e.code]||{sets:Array.from({length:e.sets},()=>({kg:'',reps:'',rir:''})),obs:''};draft.ex[e.code]=d;const last=lastFor(draft.session,e.code,draft.id);
 return `<div class="card" data-code="${e.code}"><div class="ex-head"><div class="flex" style="flex-wrap:nowrap;align-items:flex-start"><span class="code">${e.code}</span><div><h3>${esc(e.name)}</h3><div class="tiny muted">${esc(e.muscle)}</div></div></div></div>
 <div style="margin-top:6px"><span class="chip acc">${e.sets} series</span><span class="chip">${e.reps} reps</span><span class="chip">${esc(e.int)}</span><span class="chip">⏱ ${e.rest}</span></div>
 ${e.note?`<div class="tiny" style="margin-top:6px">💡 ${esc(e.note)}</div>`:''}
 ${last?`<div class="last">Última vez (${fdate(last.date)}): <b>${esc(setsTxt(last.ex[e.code].sets))}</b>${last.ex[e.code].obs?' — '+esc(last.ex[e.code].obs):''}</div>`:''}
 <div class="sets"><span></span><span class="h">Kg</span><span class="h">Reps</span><span class="h">RIR</span>

 v.innerHTML=`<div class="card"><b>Tus datos se guardan en este navegador.</b><p class="small muted">Si borras los datos del navegador o abres la app desde otro dispositivo, no estarán. Haz una copia de vez en cuando (incluye las fotos nuevas).</p>
 <div class="flex"><button class="btn" id="exp">Descargar copia</button><label class="btn ghost" style="margin:0;color:var(--ink)">Restaurar copia<input type="file" id="imp" accept=".json,application/json" hidden></label></div></div>
 <div class="card small"><b>Resumen</b><table><tr><td>Entrenos</td><td>${S.workouts.length}</td></tr><tr><td>Revisiones</td><td>${S.reviews.length}</td></tr><tr><td>Registros de peso</td><td>${S.weights.length}</td></tr><tr><td>Días de dieta</td><td>${Object.keys(S.diet).length}</td></tr></table></div>`;
 $('#exp').onclick=async()=>{const name='mi-entreno-copia-'+todayISO()+'.json';const blob=new Blob([JSON.stringify({version:1,data:S,photos:await idbAll()})],{type:'application/json'});
  // En el iPhone, la hoja de compartir permite guardar la copia en Archivos/iCloud
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Copia Mi Entreno'});return}}catch(e){if(e?.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
 $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.data?.workouts)throw 0;if(!confirm('Esto reemplaza los datos actuales por los de la copia. ¿Continuar?'))return;
  S=j.data;save();for(const[k,val]of Object.entries(j.photos||{}))await idbPut(k,val);toast('Copia restaurada');render()}catch(err){toast('Archivo no válido')}};
};

render();
// App instalable: funciona sin conexión cuando está publicada en una web (no en el link de Claude ni abriendo el archivo)
if(!CLOUD&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
